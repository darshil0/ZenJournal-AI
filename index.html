<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenJournal AI</title>
    <script>
      (function() {
        window.onerror = function(msg, url, line, col, error) {
          console.error('Global Error:', msg, 'at', url, ':', line, ':', col, error);
          const root = document.getElementById('root');
          if (root && !root.innerHTML) {
            root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;"><h1>App failed to load</h1><p>' + msg + '</p></div>';
          }
        };
        window.onunhandledrejection = function(event) {
          console.error('Unhandled Promise Rejection:', event.reason);
        };
        try {
          const settings = JSON.parse(localStorage.getItem('zenjournal_settings') || '{}');
          const theme = settings.theme || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          console.error('Error initializing theme:', e, e);
        }
      })();
    </script>
    <link rel="manifest" href="./manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Get the base path from the current URL
          const basePath = document.querySelector('base')?.getAttribute('href') || './';
          const swPath = basePath + 'sw.js';
          
          navigator.serviceWorker.register(swPath).then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">Loading ZenJournal AI...</div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
